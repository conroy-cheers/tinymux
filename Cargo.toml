[package]
name = "tinymux"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance fixed two-pane terminal multiplexer"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.28"
portable-pty = "0.9"
signal-hook = "0.3"
vt100 = "0.16"

[dev-dependencies]
assert_cmd = "2"

